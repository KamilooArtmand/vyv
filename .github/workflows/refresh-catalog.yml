# Keeps the bundled catalogue fresh: pulls several hundred real items from
# the open sources every day and commits the snapshot if it changed.
# Vercel then redeploys automatically, so the live site is always current.
name: Refresh catalogue

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-catalog.mjs
      - name: Commit if changed
        run: |
          git config user.name "vyv-bot"
          git config user.email "vyv-bot@users.noreply.github.com"
          git add public/catalog/snapshot.json
          git diff --cached --quiet || (git commit -m "chore(catalog): daily snapshot refresh" && git push)
